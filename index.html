
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>티볼 경기 기록지 (T-Ball Scorecard)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
        }
        /* 인쇄 및 PDF 저장용 스타일 */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: white !important;
                padding: 0 !important;
            }
            .shadow-xl, .shadow-md {
                box-shadow: none !important;
            }
            select {
                appearance: none;
                -webkit-appearance: none;
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-2 sm:p-4 md:p-6">
Code
<div class="max-w-7xl mx-auto space-y-6">

    <!-- 헤더 및 컨트롤 바 -->
    <header class="bg-white rounded-2xl p-4 sm:p-6 shadow-md border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="bg-amber-500 text-white p-3 rounded-xl shadow-md">
                <i class="fa-solid fa-baseball-bat-ball text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">티볼 경기 기록지</h1>
                <p class="text-xs text-slate-500 font-medium">실시간 타율 & 득점 자동 집계 스코어보드</p>
            </div>
        </div>

        <!-- 스코어 요약 전광판 -->
        <div class="flex items-center gap-4 bg-slate-900 text-white px-6 py-2.5 rounded-2xl shadow-inner">
            <div class="text-center">
                <div id="summary-team1-name" class="text-xs text-yellow-300 font-bold truncate max-w-[90px]">1팀 (노랑)</div>
                <div id="summary-team1-score" class="text-2xl font-black text-yellow-300">0</div>
            </div>
            <div class="text-lg font-black text-slate-500">VS</div>
            <div class="text-center">
                <div id="summary-team2-name" class="text-xs text-orange-400 font-bold truncate max-w-[90px]">2팀 (주황)</div>
                <div id="summary-team2-score" class="text-2xl font-black text-orange-400">0</div>
            </div>
        </div>

        <!-- 액션 버튼 -->
        <div class="flex items-center gap-2 flex-wrap justify-center no-print">
            <button onclick="addInning()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl shadow-sm transition flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i> 이닝 추가 (<span id="btn-inning-count">3</span>회)
            </button>
            <button onclick="removeInning()" id="btn-remove-inning" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-600 text-sm font-bold rounded-xl transition flex items-center gap-1.5 hidden">
                <i class="fa-solid fa-minus"></i> 이닝 삭제
            </button>
            <button onclick="window.print()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl shadow-sm transition flex items-center gap-1.5">
                <i class="fa-solid fa-print"></i> 인쇄 / PDF
            </button>
        </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="space-y-6">

        <!-- 1팀 기록 섹션 (노랑) -->
        <section class="bg-white rounded-2xl shadow-md border-2 border-yellow-400 overflow-hidden">
            <!-- 팀 타이틀 바 -->
            <div class="bg-yellow-300 text-slate-900 p-4 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-3">
                <div class="flex items-center gap-2 w-full lg:w-auto">
                    <span class="bg-slate-900 text-yellow-300 text-xs px-2.5 py-1 rounded-full font-extrabold uppercase shrink-0">HOME / 선공</span>
                    <input type="text" id="team1-name-input" value="1팀 (노랑)" oninput="updateTeamNames()" 
                           class="bg-yellow-200 text-slate-900 font-bold text-lg px-2 py-1 rounded border border-yellow-400 focus:outline-none focus:ring-2 focus:ring-slate-900 w-48">
                </div>
                <!-- 이닝별 점수 요약 -->
                <div class="flex items-center gap-2 bg-yellow-400/90 text-slate-900 px-4 py-1.5 rounded-xl border border-yellow-500 text-xs sm:text-sm overflow-x-auto max-w-full font-semibold">
                    <div id="team1-innings-summary" class="flex items-center gap-2 shrink-0">
                        <!-- 이닝 점수 동적 생성 -->
                    </div>
                    <span class="text-slate-700 mx-1">|</span>
                    <span class="font-black shrink-0">합계: <span id="team1-total-score" class="text-slate-950 text-base font-black">0</span>점</span>
                </div>
            </div>

            <!-- 1팀 테이블 -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[700px]">
                    <thead>
                        <tr id="team1-header-row1" class="bg-slate-50 text-slate-600 text-xs uppercase font-bold border-b border-slate-200">
                            <!-- JS 동적 생성 -->
                        </tr>
                        <tr id="team1-header-row2" class="bg-slate-100/70 text-[11px] text-slate-500 font-semibold border-b border-slate-200 text-center">
                            <!-- JS 동적 생성 -->
                        </tr>
                    </thead>
                    <tbody id="team1-tbody" class="divide-y divide-slate-200 text-sm">
                        <!-- JS 동적 생성 -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 2팀 기록 섹션 (주황) -->
        <section class="bg-white rounded-2xl shadow-md border-2 border-orange-400 overflow-hidden">
            <!-- 팀 타이틀 바 -->
            <div class="bg-orange-500 text-white p-4 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-3">
                <div class="flex items-center gap-2 w-full lg:w-auto">
                    <span class="bg-slate-950 text-orange-300 text-xs px-2.5 py-1 rounded-full font-extrabold uppercase shrink-0">AWAY / 후공</span>
                    <input type="text" id="team2-name-input" value="2팀 (주황)" oninput="updateTeamNames()" 
                           class="bg-orange-600 text-white font-bold text-lg px-2 py-1 rounded border border-orange-400 focus:outline-none focus:ring-2 focus:ring-white w-48">
                </div>
                <!-- 이닝별 점수 요약 -->
                <div class="flex items-center gap-2 bg-orange-600/90 text-white px-4 py-1.5 rounded-xl border border-orange-400 text-xs sm:text-sm overflow-x-auto max-w-full font-semibold">
                    <div id="team2-innings-summary" class="flex items-center gap-2 shrink-0">
                        <!-- 이닝 점수 동적 생성 -->
                    </div>
                    <span class="text-orange-200 mx-1">|</span>
                    <span class="font-black shrink-0">합계: <span id="team2-total-score" class="text-yellow-300 text-base font-black">0</span>점</span>
                </div>
            </div>

            <!-- 2팀 테이블 -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[700px]">
                    <thead>
                        <tr id="team2-header-row1" class="bg-slate-50 text-slate-600 text-xs uppercase font-bold border-b border-slate-200">
                            <!-- JS 동적 생성 -->
                        </tr>
                        <tr id="team2-header-row2" class="bg-slate-100/70 text-[11px] text-slate-500 font-semibold border-b border-slate-200 text-center">
                            <!-- JS 동적 생성 -->
                        </tr>
                    </thead>
                    <tbody id="team2-tbody" class="divide-y divide-slate-200 text-sm">
                        <!-- JS 동적 생성 -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

</div>

<!-- JavaScript 로직 -->
<script>
    // 타구 결과 옵션
    const RESULT_OPTIONS = [
        { value: '', label: '- 선택 -' },
        { value: '1루타', label: '1루타 (안타)' },
        { value: '2루타', label: '2루타 (안타)' },
        { value: '파울아웃', label: '파울아웃' },
        { value: '플라잉아웃', label: '플라잉아웃' }
    ];

    // 득점 옵션
    const SCORE_OPTIONS = [
        { value: 'x', label: 'X' },
        { value: 'o', label: 'O (득점)' }
    ];

    let totalInnings = 3; // 기본 이닝 수 (3회)

    // 초기 동적 데이터 구조 생성 함수
    function createInitialTeamData(inningsCount) {
        const createPlayers = (prefix) => Array.from({ length: 7 }, (_, i) => ({
            name: `${prefix} ${i + 1}`,
            innings: Array.from({ length: inningsCount }, () => ({ result: '', score: 'x' }))
        }));

        return {
            team1: createPlayers('1팀 타자'),
            team2: createPlayers('2팀 타자')
        };
    }

    let teamData = createInitialTeamData(totalInnings);

    // 페이지 로드 시 초기화 및 렌더링
    window.onload = function() {
        renderAll();
    };

    // 이닝 추가 (+ 버튼)
    function addInning() {
        totalInnings++;
        ['team1', 'team2'].forEach(teamKey => {
            teamData[teamKey].forEach(player => {
                player.innings.push({ result: '', score: 'x' });
            });
        });
        renderAll();
    }

    // 이닝 삭제 (- 버튼, 최소 1회 유지)
    function removeInning() {
        if (totalInnings <= 1) return;
        totalInnings--;
        ['team1', 'team2'].forEach(teamKey => {
            teamData[teamKey].forEach(player => {
                player.innings.pop();
            });
        });
        renderAll();
    }

    // 전체 UI 갱신 함수
    function renderAll() {
        document.getElementById('btn-inning-count').innerText = totalInnings;
        const removeBtn = document.getElementById('btn-remove-inning');
        if (totalInnings > 3) {
            removeBtn.classList.remove('hidden');
        } else {
            removeBtn.classList.add('hidden');
        }

        renderHeaders('team1');
        renderHeaders('team2');
        renderTable('team1');
        renderTable('team2');
        calculateAll();
    }

    // 팀명 변경 시 전광판 업데이트
    function updateTeamNames() {
        const t1 = document.getElementById('team1-name-input').value || '1팀';
        const t2 = document.getElementById('team2-name-input').value || '2팀';
        document.getElementById('summary-team1-name').innerText = t1;
        document.getElementById('summary-team2-name').innerText = t2;
    }

    // 테이블 헤더 동적 생성
    function renderHeaders(teamKey) {
        const row1 = document.getElementById(`${teamKey}-header-row1`);
        const row2 = document.getElementById(`${teamKey}-header-row2`);

        let r1Html = `<th class="p-3 text-center w-12">타순</th><th class="p-3 w-36">선수명</th>`;
        let r2Html = `<th></th><th></th>`;

        for (let i = 1; i <= totalInnings; i++) {
            const bgStyle = teamKey === 'team1' 
                ? (i % 2 === 1 ? 'bg-yellow-100/70' : 'bg-yellow-50') 
                : (i % 2 === 1 ? 'bg-orange-100/60' : 'bg-orange-50/50');
            r1Html += `<th class="p-3 text-center ${bgStyle} border-x border-slate-200" colspan="2">${i}회 공격</th>`;
            r2Html += `
                <th class="py-1 border-l border-slate-200 w-32">주자(결과)</th>
                <th class="py-1 border-r border-slate-200 w-16">득점</th>
            `;
        }

        r1Html += `<th class="p-3 text-center w-28 bg-slate-100">개인 타율</th>`;
        r2Html += `<th class="bg-slate-100 text-center">안타/타수</th>`;

        row1.innerHTML = r1Html;
        row2.innerHTML = r2Html;

        // 헤더 요약란(이닝 목록) 생성
        const summaryContainer = document.getElementById(`${teamKey}-innings-summary`);
        let summaryHtml = '';
        const textColorClass = teamKey === 'team1' ? 'text-slate-950 font-black' : 'text-yellow-300 font-black';
        const separatorClass = teamKey === 'team1' ? 'text-yellow-700' : 'text-orange-200';
        for (let i = 1; i <= totalInnings; i++) {
            if (i > 1) summaryHtml += `<span class="${separatorClass}">|</span>`;
            summaryHtml += `<span>${i}회: <strong id="${teamKey}-inning${i}-total" class="${textColorClass}">0</strong>점</span>`;
        }
        summaryContainer.innerHTML = summaryHtml;
    }

    // 테이블 데이터 동적 출력
    function renderTable(teamKey) {
        const tbody = document.getElementById(`${teamKey}-tbody`);
        tbody.innerHTML = '';

        teamData[teamKey].forEach((player, pIdx) => {
            const tr = document.createElement('tr');
            tr.className = pIdx % 2 === 0 ? 'bg-white' : 'bg-slate-50/50';

            // 타순 번호 & 이름 입력
            let html = `
                <td class="p-3 text-center font-bold text-slate-500">${pIdx + 1}</td>
                <td class="p-2">
                    <input type="text" value="${player.name}" 
                        onchange="updatePlayerName('${teamKey}', ${pIdx}, this.value)"
                        class="w-full bg-transparent font-medium border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:bg-white focus:outline-none px-1 py-0.5 rounded transition text-slate-800">
                </td>
            `;

            // 각 이닝별 입력란 생성
            for (let i = 0; i < totalInnings; i++) {
                const currentResult = player.innings[i] ? player.innings[i].result : '';
                const currentScore = player.innings[i] ? player.innings[i].score : 'x';

                const resultOptionsHtml = RESULT_OPTIONS.map(opt => 
                    `<option value="${opt.value}" ${opt.value === currentResult ? 'selected' : ''}>${opt.label}</option>`
                ).join('');

                const scoreOptionsHtml = SCORE_OPTIONS.map(opt => 
                    `<option value="${opt.value}" ${opt.value === currentScore ? 'selected' : ''}>${opt.label}</option>`
                ).join('');

                const scoreBg = currentScore === 'o' ? 'bg-amber-100 text-amber-800 font-bold border-amber-300' : 'text-slate-400';
                const resultBg = (currentResult === '1루타' || currentResult === '2루타') ? 'bg-emerald-50 text-emerald-700 font-semibold' : '';

                html += `
                    <!-- 주자 (타구 결과) -->
                    <td class="p-1.5 border-l border-slate-200">
                        <select onchange="updateInningData('${teamKey}', ${pIdx}, ${i}, 'result', this.value)" 
                                class="w-full text-xs p-1.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white ${resultBg}">
                            ${resultOptionsHtml}
                        </select>
                    </td>
                    <!-- 득점 (O/X) -->
                    <td class="p-1.5 border-r border-slate-200 text-center">
                        <select onchange="updateInningData('${teamKey}', ${pIdx}, ${i}, 'score', this.value)" 
                                class="w-full text-xs p-1.5 rounded-lg border border-slate-300 text-center font-bold focus:ring-2 focus:ring-indigo-500 focus:outline-none ${scoreBg}">
                            ${scoreOptionsHtml}
                        </select>
                    </td>
                `;
            }

            // 타율 출력 칸
            html += `
                <td class="p-3 text-center bg-slate-100/60 font-medium">
                    <div id="${teamKey}-p${pIdx}-avg" class="font-bold text-slate-800 text-sm">.000</div>
                    <div id="${teamKey}-p${pIdx}-detail" class="text-[10px] text-slate-400 font-normal">0안타 / 0타수</div>
                </td>
            `;

            tr.innerHTML = html;
            tbody.appendChild(tr);
        });
    }

    // 선수 이름 변경 handler
    function updatePlayerName(teamKey, playerIndex, name) {
        teamData[teamKey][playerIndex].name = name;
    }

    // 이닝 기록 변경 handler
    function updateInningData(teamKey, playerIndex, inningIndex, field, value) {
        teamData[teamKey][playerIndex].innings[inningIndex][field] = value;
        renderTable(teamKey);
        calculateAll();
    }

    // 연동 계산 로직 (타율 및 이닝별/전체 득점)
    function calculateAll() {
        ['team1', 'team2'].forEach(teamKey => {
            let teamTotalScore = 0;
            let inningTotals = new Array(totalInnings).fill(0);

            teamData[teamKey].forEach((player, pIdx) => {
                let hits = 0;   // 안타 수 (1루타, 2루타)
                let atBats = 0; // 타수

                player.innings.forEach((inn, iIdx) => {
                    if (iIdx >= totalInnings) return;

                    if (inn.result !== '') {
                        atBats++;
                        if (inn.result === '1루타' || inn.result === '2루타') {
                            hits++;
                        }
                    }

                    if (inn.score === 'o') {
                        inningTotals[iIdx]++;
                        teamTotalScore++;
                    }
                });

                // 개인 타율 계산
                const avg = atBats > 0 ? (hits / atBats).toFixed(3) : '.000';
                const displayAvg = avg === '1.000' ? '1.000' : avg.replace('0.', '.');

                // UI 업데이트 - 타율
                const avgElem = document.getElementById(`${teamKey}-p${pIdx}-avg`);
                const detailElem = document.getElementById(`${teamKey}-p${pIdx}-detail`);

                if (avgElem && detailElem) {
                    avgElem.innerText = displayAvg;
                    detailElem.innerText = `${hits}안타 / ${atBats}타수`;
                    
                    if (parseFloat(avg) >= 0.500 && atBats > 0) {
                        avgElem.className = 'font-bold text-red-600 text-sm';
                    } else if (parseFloat(avg) >= 0.300 && atBats > 0) {
                        avgElem.className = 'font-bold text-blue-600 text-sm';
                    } else {
                        avgElem.className = 'font-bold text-slate-800 text-sm';
                    }
                }
            });

            // 이닝별 득점 전광판 업데이트
            for (let i = 0; i < totalInnings; i++) {
                const innElem = document.getElementById(`${teamKey}-inning${i+1}-total`);
                if (innElem) innElem.innerText = inningTotals[i];
            }

            // 팀 총 득점 업데이트
            const totalElem = document.getElementById(`${teamKey}-total-score`);
            const summaryElem = document.getElementById(`summary-${teamKey}-score`);
            if (totalElem) totalElem.innerText = teamTotalScore;
            if (summaryElem) summaryElem.innerText = teamTotalScore;
        });
    }
</script>
</body>
</html>
